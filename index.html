<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material 3 Silver Display</title>
    <style>
        /* CSS Reset & Material 3 Variables */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Material 3 Silver & Dark Neutral Palette */
            --m3-silver-base: #1c1d1f;
            --m3-silver-container: #2b2d31;
            --m3-pure-white: #ffffff;
            --m3-elevation-surface: rgba(255, 255, 255, 0.05);
            --m3-border-silver: rgba(220, 225, 230, 0.2);
            --m3-glow-silver: rgba(230, 235, 240, 0.15);
        }

        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--m3-silver-base);
            /* Material 3 Dynamic Animated Silver Background Gradient */
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(180, 190, 200, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(140, 150, 165, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(220, 225, 235, 0.08) 0%, transparent 60%);
            background-size: 150% 150%;
            animation: silverBgShift 12s ease-in-out infinite alternate;
            color: var(--m3-pure-white);
        }

        /* Full Screen Center Container */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: clamp(1rem, 5vw, 3rem);
            text-align: center;
        }

        /* Material 3 Card Container for Name */
        .m3-silver-card {
            background: var(--m3-elevation-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--m3-border-silver);
            border-radius: clamp(1.5rem, 4vw, 3rem);
            padding: clamp(2rem, 6vw, 4.5rem) clamp(1.5rem, 5vw, 4rem);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 90%;
            animation: cardFloat 4s ease-in-out infinite alternate;
        }

        /* Pure White Animated Name */
        .pure-white-name {
            /* Pure White Color */
            color: var(--m3-pure-white);
            
            /* Fluid Typography */
            font-size: clamp(2.5rem, calc(1rem + 8vw), 7.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            word-break: break-word;

            /* Silver Drop Shadow / Glow for Elegance */
            text-shadow: 
                0 0 20px var(--m3-glow-silver),
                0 10px 30px rgba(0, 0, 0, 0.5);

            margin-bottom: clamp(1rem, calc(0.5rem + 2vw), 2.5rem);
            
            /* Subtle Breathing Pulse Animation */
            animation: textPulse 3s ease-in-out infinite alternate;
        }

        /* Emoji Styling and Animation */
        .emoji {
            font-size: clamp(3rem, calc(1.5rem + 6vw), 6rem);
            display: inline-block;
            cursor: pointer;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.4));
            animation: bounceEmoji 2.5s ease-in-out infinite;
            user-select: none;
            transition: transform 0.2s ease;
        }

        .emoji:hover {
            transform: scale(1.25) rotate(10deg);
        }

        /* Background & UI Animations */
        @keyframes silverBgShift {
            0% {
                background-position: 0% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            100% {
                background-position: 0% 0%;
            }
        }

        @keyframes cardFloat {
            0% {
                transform: translateY(0px);
            }
            100% {
                transform: translateY(-12px);
            }
        }

        @keyframes textPulse {
            0% {
                opacity: 0.95;
                text-shadow: 0 0 15px var(--m3-glow-silver);
            }
            100% {
                opacity: 1;
                text-shadow: 0 0 35px rgba(255, 255, 255, 0.4);
            }
        }

        @keyframes bounceEmoji {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-18px) scale(1.08);
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- Material 3 Surface Card -->
        <div class="m3-silver-card">
            <!-- Pure White Name -->
            <h1 class="pure-white-name">FUCK YOU আগে মিস্ট্রি খাওয়া তার পর ঠিক হবে analyzer</h1>
            
            <!-- Emoji -->
            <div class="emoji" role="img" aria-label="emoji">🖕</div>
        </div>
    </main>

</body>
</html>
